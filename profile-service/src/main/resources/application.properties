spring.application.name=profile-service
server.port=8086

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:profiledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Use same JWT secret as user-service for validation
jwt.secret=MySecretKeyForJWTTokenGeneration1234567890123456789012345678901234567890
jwt.expiration=86400000
